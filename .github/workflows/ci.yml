name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      caldiy_image:
        description: "Cal.diy image to test (the upgrade check: try the next version here before deploying it)"
        default: "calcom/cal.com:v6.2.0"
        required: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: UTC # the browser and Node both run in UTC, so guest time zones are always chosen explicitly

jobs:
  api:
    name: API tests (Cal.com public slots API)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # A public event in the tester's own cal.com account; a secret so it's masked in logs.
      CAL_API_USERNAME: ${{ secrets.CAL_API_USERNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Run API tests
        uses: cypress-io/github-action@18016a55674bd02cabf197de5762a1710cb5577c # v7.4.9
        with:
          browser: chrome
          spec: cypress/e2e/api/**/*.cy.ts
          config: video=false
          summary-title: API tests

  e2e:
    name: Booking-flow tests (self-hosted Cal.diy)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CALDIY_IMAGE: ${{ inputs.caldiy_image || 'calcom/cal.com:v6.2.0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Start Cal.diy + Postgres and seed the test host
        run: npm run app:up

      - name: Run booking-flow tests
        uses: cypress-io/github-action@18016a55674bd02cabf197de5762a1710cb5577c # v7.4.9
        with:
          browser: chrome
          spec: cypress/e2e/booking/**/*.cy.ts
          summary-title: Booking-flow tests (${{ env.CALDIY_IMAGE }})

      - name: Save Cal.diy logs
        if: failure()
        run: docker compose -f docker/compose.yml logs --no-color > caldiy.log

      - name: Upload screenshots and logs (failures only)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failure-evidence
          path: |
            cypress/screenshots
            caldiy.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test videos
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: videos
          path: cypress/videos
          if-no-files-found: ignore
          retention-days: 14
